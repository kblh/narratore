<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Narratore</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Narratore">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1><img src="icon.svg" alt="" width="44" height="44"> Narratore</h1>

    <form id="form">
      <label for="text" class="sr">Frasi italiane</label>
      <textarea id="text" rows="6" placeholder="Scrivi una o più frasi (una per riga o terminata da un punto)…"></textarea>
      <button type="submit" class="primary">Aggiungi</button>
    </form>

    <p id="warn" class="warn" hidden>Il tuo browser non supporta la sintesi vocale.</p>
    <p id="noit" class="warn" hidden>Nessuna voce italiana trovata nel sistema: verrà usata quella predefinita.</p>

    <ul id="list"></ul>
    <p id="empty" class="empty">Nessuna frase per ora.</p>

    <div id="controls" hidden>
      <div class="pause">
        <label for="pause">Pausa tra le frasi: <output id="pauseVal">1 s</output></label>
        <input id="pause" type="range" min="1" max="10" step="1" value="1">
      </div>
      <div class="actions">
        <button id="playAll" class="primary" type="button">▶ Riproduci tutto</button>
        <button id="stopAll" class="primary" type="button" disabled>■ Ferma</button>
        <button id="clearAll" class="primary danger" type="button">✕ Elimina tutto</button>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
