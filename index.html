<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Narratore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Narratore</h1>

    <form id="form">
      <label for="text" class="sr">Frasi italiane</label>
      <textarea id="text" rows="6" placeholder="Scrivi una o più frasi (una per riga o terminata da un punto)…"></textarea>
      <button type="submit" class="primary">Aggiungi</button>
    </form>

    <p id="warn" class="warn" hidden>Il tuo browser non supporta la sintesi vocale.</p>
    <p id="noit" class="warn" hidden>Nessuna voce italiana trovata nel sistema: verrà usata quella predefinita.</p>

    <ul id="list"></ul>
    <p id="empty" class="empty">Nessuna frase per ora.</p>

    <div id="actions" class="actions" hidden>
      <button id="playAll" class="primary" type="button">▶ Riproduci tutto</button>
      <button id="clearAll" class="primary danger" type="button">✕ Elimina tutto</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
